app = "umkm-kasir"
primary_region = "sin"

[build]
  image = "Dockerfile"

[env]
  PORT = "8000"
  DB_FILE = "/app/data/umkm.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "umkm_data"
  destination = "/app/data"
